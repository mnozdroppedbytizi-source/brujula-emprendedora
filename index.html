<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Brújula Emprendedora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concepto: una brújula de decisiones. Columna única, una pregunta por pantalla con 12 marcas de avance, y un informe tipo dossier con siete secciones numeradas. */
:root{
  --bg:#F2F4F1;
  --surface:#FFFFFF;
  --ink:#101C17;
  --muted:#56665E;
  --line:#D6DDD8;
  --accent:#0C6B52;
  --on-accent:#FFFFFF;
  --accent-soft:#DFF0E9;
  --signal:#A85A0C;
  --signal-soft:#FBEBD6;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1310;--surface:#121C17;--ink:#E6EFEA;--muted:#93A59B;--line:#243229;
    --accent:#46D3A6;--on-accent:#05241A;--accent-soft:#14302A;--signal:#F0A24F;--signal-soft:#2B2012;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1310;--surface:#121C17;--ink:#E6EFEA;--muted:#93A59B;--line:#243229;
  --accent:#46D3A6;--on-accent:#05241A;--accent-soft:#14302A;--signal:#F0A24F;--signal-soft:#2B2012;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul{padding:0;list-style:none}
a{color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:4px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em}
.brand svg{width:30px;height:30px;color:var(--ink)}
.brand .n{fill:var(--signal)}
.brand .s{fill:var(--ink)}
.kicker{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* tarjetas y botones */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,36px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;cursor:pointer;transition:transform .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:10px 0;color:var(--muted);cursor:pointer;font-weight:500}
.link:hover{color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* introducción */
.intro h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,6.4vw,52px);line-height:1.04;letter-spacing:-.025em;text-wrap:balance;margin:14px 0 16px}
.intro .lead{font-size:18px;max-width:58ch;color:var(--muted)}
.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:26px 0}
.area{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--bg)}
.area b{font-weight:600}
.area span{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
@media(max-width:560px){.areas{grid-template-columns:1fr}}
.fine{font-size:13.5px;color:var(--muted);margin-top:16px}

/* pregunta */
.ticks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.ticks i{height:6px;background:var(--line);border-radius:2px;display:block}
.ticks i.done{background:var(--accent)}
.ticks i.now{background:var(--signal)}
.qmeta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.qmeta .fu{color:var(--signal)}
.qtitle{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,4.6vw,32px);line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
.hint{color:var(--muted);margin-top:10px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:14px;align-items:start;text-align:left;width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:16px;line-height:1.4;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .l{font-family:var(--f-mono);font-size:13px;font-weight:500;width:28px;height:28px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ask{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.ask label{font-weight:600;font-size:14.5px}
.ask input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.ask input:focus-visible{border-color:var(--accent)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.qfoot .kicker{text-transform:none;letter-spacing:.02em}
@media(prefers-reduced-motion:no-preference){.qanim{animation:rise .28s ease both}@keyframes rise{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* informe */
.rhead{display:flex;flex-direction:column;gap:14px;padding:6px 0 4px}
.rhead h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,6vw,50px);line-height:1.04;letter-spacing:-.025em;text-wrap:balance}
.rhead p{color:var(--muted);max-width:60ch}
.jump{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;font-weight:500}
.chip span{font-family:var(--f-mono);color:var(--signal);margin-right:6px}
.chip:hover{border-color:var(--accent)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,32px);display:flex;flex-direction:column;gap:20px;scroll-margin-top:16px}
.sh{display:flex;align-items:baseline;gap:14px}
.num{font-family:var(--f-mono);font-size:13px;color:var(--signal);font-weight:500;letter-spacing:.06em}
.sh h2{font-family:var(--f-display);font-size:clamp(22px,4vw,28px);letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
.pname{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5.4vw,40px);letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--signal);margin-bottom:6px}
.lead2{font-size:17.5px;max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fact{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);min-width:0}
.fact b{display:block;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.fact span{font-weight:600;font-size:15px}
@media(max-width:620px){.facts{grid-template-columns:repeat(2,1fr)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.two>div{min-width:0}
@media(max-width:620px){.two{grid-template-columns:1fr}}
.sec h4{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.dots li{padding-left:18px;position:relative;margin-bottom:8px}
.dots li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:12px;align-items:center;font-size:14.5px}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px}
@media(max-width:480px){.bar{grid-template-columns:1fr;gap:4px}}
.note{background:var(--signal-soft);border-radius:10px;padding:12px 14px;font-size:15px}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.4vw,30px);line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.steps{display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0;padding-top:0}
.steps .tm{font-family:var(--f-mono);font-size:12px;color:var(--signal);font-weight:500;padding-top:3px}
.steps b{display:block;font-weight:700;margin-bottom:2px}
.steps p{color:var(--muted)}
@media(max-width:480px){.steps li{grid-template-columns:1fr;gap:4px}}
.script{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:14px 16px;font-size:15px;margin-top:10px;color:var(--ink)}
.month{display:grid;grid-template-columns:190px 1fr;gap:24px;padding:20px 0;border-top:1px solid var(--line)}
.month:first-of-type{border-top:0;padding-top:0}
.month h3{font-family:var(--f-display);font-size:20px;line-height:1.15;letter-spacing:-.01em}
.month .rng{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.month ul li{padding-left:18px;position:relative;margin-bottom:9px}
.month ul li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.goal{margin-top:12px;padding:11px 14px;border-radius:10px;background:var(--signal-soft);font-weight:500;font-size:15px}
@media(max-width:620px){.month{grid-template-columns:1fr;gap:10px}}
.mist li{padding:16px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:26px 1fr;gap:10px}
.mist li:first-child{border-top:0;padding-top:0}
.mist .x{font-family:var(--f-mono);color:var(--signal);font-weight:500;font-size:18px;line-height:1.3}
.mist b{display:block;font-weight:700;margin-bottom:3px}
.mist p{color:var(--muted)}
.reslist li{display:grid;grid-template-columns:minmax(0,230px) 1fr;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.reslist li:first-child{border-top:0}
.reslist b{font-weight:600}
.reslist p{color:var(--muted);font-size:15px}
@media(max-width:560px){.reslist li{grid-template-columns:1fr;gap:2px}}
.final{background:var(--ink);color:var(--bg);border-radius:14px;padding:clamp(22px,4vw,34px);display:flex;flex-direction:column;gap:18px}
.final .big{color:var(--bg)}
.final p{opacity:.9;max-width:60ch}
.final .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.final .btn.ghost{background:transparent;color:var(--bg);border-color:var(--muted)}
.copybox{width:100%;min-height:140px;font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="shell" id="root"></div>

<script>
"use strict";
var LS_KEY = "brujula-emprendedora-v1";
var LET = "ABCDEF";
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

/* ---------- Preguntas ---------- */
var Q = [
  { id:"sit", area:"Situación actual", q:"¿Cuál describe mejor tu situación laboral hoy?", opts:[
    { t:"Tengo un trabajo de tiempo completo con ingreso estable", k:"ft" },
    { t:"Trabajo medio tiempo o mis ingresos son irregulares", k:"pt" },
    { t:"Estoy estudiando", k:"st" },
    { t:"Estoy sin trabajo y busco ingresos", k:"un" },
    { t:"Otra situación", k:"ot", ask:"Cuéntame tu situación en una línea" }
  ]},
  { id:"hours", area:"Situación actual", q:"¿Cuántas horas por semana puedes dedicar de verdad a un proyecto propio?", hint:"Cuenta solo las horas que puedes sostener, no las ideales.", opts:[
    { t:"Menos de 5 horas", v:3 },
    { t:"Entre 5 y 10 horas", v:8 },
    { t:"Entre 10 y 20 horas", v:15 },
    { t:"Más de 20 horas", v:30 }
  ]},
  { id:"cap", area:"Situación actual", q:"¿Cuánto dinero puedes invertir sin que sea un problema si lo pierdes?", hint:"Piensa en dólares. Es dinero que no necesitas para vivir.", opts:[
    { t:"Casi nada (de USD 0 a 30)", v:0 },
    { t:"Hasta USD 200", v:1 },
    { t:"Entre USD 200 y USD 1.000", v:2 },
    { t:"Más de USD 1.000", v:3 }
  ]},
  { id:"exp", area:"Situación actual", q:"¿Cuál es tu experiencia emprendiendo hasta hoy?", opts:[
    { t:"Ninguna, es mi primera vez", v:0 },
    { t:"Lo intenté antes y no funcionó", v:1 },
    { t:"Vendí cosas o servicios de manera informal", v:2 },
    { t:"Tengo o tuve un negocio en marcha", v:3 }
  ]},
  { id:"appr", area:"Personalidad y forma de trabajar", q:"Cuando no sabes si algo va a funcionar, ¿qué haces?", opts:[
    { t:"Necesito un plan detallado antes de moverme", k:"plan", w:{analit:2} },
    { t:"Pruebo algo pequeño, miro qué pasa y ajusto", k:"test", w:{analit:1,ejec:1} },
    { t:"Me lanzo y corrijo sobre la marcha", k:"launch", w:{ejec:2} },
    { t:"Prefiero seguir un método probado que me guíe", k:"method", w:{analit:1}, s:{oper:1} }
  ]},
  { id:"style", area:"Personalidad y forma de trabajar", q:"¿Cómo trabajas mejor?", opts:[
    { t:"Solo, con concentración profunda", k:"solo", w:{analit:1,creat:1} },
    { t:"Hablando y colaborando con otras personas", k:"team", w:{rel:2} },
    { t:"Con rutinas, listas y objetivos claros", k:"routine", w:{analit:1,ejec:1}, s:{oper:1} },
    { t:"Con libertad, variedad y cambiando de actividad", k:"free", w:{creat:2} }
  ]},
  { id:"sales", area:"Personalidad y forma de trabajar", q:"¿Qué sientes al ofrecerle algo tuyo a una persona que no conoces?", opts:[
    { t:"Me bloquea, prefiero evitarlo", v:0 },
    { t:"Me da nervios, pero lo hago", v:1, w:{ejec:1} },
    { t:"Me siento cómodo", v:2, w:{rel:1,ejec:1} },
    { t:"Lo disfruto, me da energía", v:3, w:{rel:2,ejec:1} }
  ]},
  { id:"skill", area:"Habilidades e intereses", q:"¿Qué habilidad te describe mejor hoy?", hint:"Elige la que otras personas más te reconocen, aunque no la hayas cobrado nunca.", opts:[
    { t:"Comunicar, explicar, escribir o crear contenido", k:"contenido", s:{contenido:3}, w:{creat:1,rel:1} },
    { t:"Organizar, ordenar y planificar", k:"oper", s:{oper:3}, w:{analit:2} },
    { t:"Manejar tecnología, herramientas digitales o datos", k:"tecnico", s:{tecnico:3}, w:{analit:1,creat:1} },
    { t:"Trabajar con las manos o dominar un oficio", k:"oficio", s:{oficio:3}, w:{ejec:1} },
    { t:"Vender, negociar y convencer", k:"ventas", s:{ventas:3}, w:{rel:1,ejec:1} }
  ]},
  { id:"int", area:"Habilidades e intereses", q:"¿Qué temas te hacen perder la noción del tiempo?", opts:[
    { t:"Educación y ayudar a otros a mejorar", k:"edu", s:{contenido:1}, w:{rel:1} },
    { t:"Tecnología y automatización", k:"tech", s:{tecnico:1} },
    { t:"Diseño, arte y estética", k:"design", s:{contenido:1}, w:{creat:1} },
    { t:"Comida, hogar y servicios locales", k:"local", s:{oficio:1} },
    { t:"Negocios, finanzas y marketing", k:"biz", s:{ventas:1,oper:1} },
    { t:"Otro interés", k:"other", ask:"Cuéntame cuál es en pocas palabras" }
  ]},
  { id:"urg", area:"Mis objetivos", q:"¿Cuándo necesitas que tu proyecto empiece a darte ingresos?", opts:[
    { t:"En 30 a 60 días, lo necesito pronto", v:3 },
    { t:"En 3 a 6 meses", v:2 },
    { t:"En 6 a 12 meses", v:1 },
    { t:"No tengo urgencia, prefiero construir bien a largo plazo", v:0 }
  ]},
  { id:"goal", area:"Mis objetivos", q:"¿Qué quieres lograr con tu emprendimiento?", opts:[
    { t:"Un ingreso extra de USD 200 a 500 por mes", k:"extra" },
    { t:"Reemplazar mi ingreso actual", k:"replace" },
    { t:"Construir una empresa que crezca y escale", k:"scale" },
    { t:"Tener libertad de tiempo y de lugar", k:"free" }
  ]},
  { id:"block", area:"Mis objetivos", q:"¿Qué es lo que más te frena hoy?", opts:[
    { t:"Miedo a fallar o a quedar mal", k:"fear" },
    { t:"No sé qué negocio elegir", k:"idea" },
    { t:"Falta de dinero", k:"money" },
    { t:"Falta de tiempo", k:"time" },
    { t:"Me falta conocimiento o experiencia", k:"knowledge" }
  ]}
];

var FU = [
  { id:"fu_service", after:"urg", area:"Aclaración",
    q:"Necesitas ingresos pronto y partes casi sin capital. ¿Estarías dispuesto a vender un servicio con lo que ya sabes, antes de crear un producto?",
    hint:"Es el camino más rápido para cobrar con poco dinero. Quiero saber si te sirve antes de armar tu plan.",
    opts:[
      { t:"Sí, estoy dispuesto a ofrecer un servicio", k:"yes" },
      { t:"Prefiero vender productos físicos o reventa", k:"product" },
      { t:"Todavía no lo sé", k:"unsure" }
    ],
    show:function(a){ var c=optOf(a,"cap"), u=optOf(a,"urg"); return !!(c&&u&&c.v===0&&u.v===3); } },
  { id:"fu_sales", after:"skill", area:"Aclaración",
    q:"Dijiste que ofrecer algo a desconocidos te bloquea. ¿Qué es lo que más pesa?",
    hint:"La respuesta cambia cómo armo tus primeros 30 días.",
    opts:[
      { t:"Miedo al rechazo", k:"reject" },
      { t:"No sé cómo hablar de precios", k:"price" },
      { t:"No sé qué decir ni cómo empezar la conversación", k:"script" },
      { t:"Siento que no tengo nada que valga la pena ofrecer", k:"worth" }
    ],
    show:function(a){ var s=optOf(a,"sales"); return !!(s&&s.v===0); } },
  { id:"fu_time", after:"goal", area:"Aclaración",
    q:"Quieres reemplazar tu ingreso, pero hoy tienes menos de 5 horas por semana. ¿Qué estás dispuesto a hacer?",
    hint:"Con ese tiempo, el objetivo y el plan no coinciden. Elige el ajuste que sí vas a sostener.",
    opts:[
      { t:"Liberar tiempo (dejar compromisos o negociar horarios)", k:"free" },
      { t:"Ir por etapas y aceptar un camino de 12 a 18 meses", k:"stages" },
      { t:"Por ahora aspirar a un ingreso complementario", k:"partial" }
    ],
    show:function(a){ var g=optOf(a,"goal"), h=optOf(a,"hours"); return !!(g&&h&&g.k==="replace"&&h.v===3); } }
];
var ALL = Q.concat(FU);
function optOf(a,id){ var q=null,i; for(i=0;i<ALL.length;i++){ if(ALL[i].id===id){ q=ALL[i]; break; } } return (q&&a[id]!=null)?q.opts[a[id]]:null; }
function qById(id){ for(var i=0;i<ALL.length;i++){ if(ALL[i].id===id) return ALL[i]; } return null; }

/* ---------- Estado ---------- */
var S = { view:"intro", a:{}, tx:{}, pos:0, lock:false, copyFallback:false, confirmReset:false };
function load(){
  try{ var r=localStorage.getItem(LS_KEY); if(r){ var o=JSON.parse(r); S.a=o.a||{}; S.tx=o.tx||{}; S.pos=o.pos||0; } }catch(e){}
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({a:S.a,tx:S.tx,pos:S.pos})); }catch(e){} }
function flow(){
  var f=[], i, j;
  for(i=0;i<Q.length;i++){
    f.push(Q[i].id);

function derive(){

  var T={ejec:0,analit:0,creat:0,rel:0}, K={contenido:0,oper:0,tecnico:0,oficio:0,ventas:0};
  fl.forEach(function(id){
    var op=o(id); if(!op) return;
    var w=op.w||{}, s=op.s||{}, k;
    for(k in w) T[k]+=w[k];
    for(k in s) K[k]+=s[k];
  });
  var d={ T:T, K:K,
    sit:g("sit","k"), sitTx:S.tx.sit||"",
    hours:g("hours","v"), cap:g("cap","v"), exp:g("exp","v"),
    appr:g("appr","k"), style:g("style","k"), sales:g("sales","v"),
    skill:g("skill","k"), int:g("int","k"), intTx:S.tx.int||"",
    urg:g("urg","v"), goal:g("goal","k"), block:g("block","k"),
    fuS:g("fu_service","k"), fuSales:g("fu_sales","k"), fuTime:g("fu_time","k") };
  d.hoursEff = d.fuTime==="free" ? Math.max(d.hours,8) : d.hours;
  d.goalEff = d.fuTime==="partial" ? "extra" : d.goal;

  if(d.urg===3) B.audiencia-=3;
  if(d.hours<=3) B.audiencia-=1;
  if(sk==="tecnico") B.producto+=3;
  if(d.urg<=1) B.producto+=2;
  if(d.hours>=15) B.producto+=1;
  if(d.goalEff==="scale") B.producto+=1;
  if(d.int==="tech") B.producto+=1;
  if(d.urg===3) B.producto-=3;
  if(sk==="oper") B.gestion+=4;
  if(T.analit>=2) B.gestion+=1;
  if(d.urg>=2) B.gestion+=1;
  if(d.cap<=1) B.gestion+=1;
  B[ALIGN[sk]]+=0.5;
  var ranked=Object.keys(B).sort(function(x,y){ return B[y]-B[x]; });
  var bz=ranked[0], bz2=ranked[1], bd=BIZ[bz];
  var offer = bz==="servicio" ? (bd.offer[sk]||bd.offer.tecnico) : bd.offer;
  var ideas = bz==="servicio" ? (bd.ideas[sk]||bd.ideas.tecnico) : bd.ideas;
  var reasons=[];
  reasons.push(d.urg>=2 ? "Necesitas ingresos en menos de 6 meses, y este modelo permite cobrar en semanas, no en meses." : "No tienes urgencia, así que puedes cuidar la calidad y el precio desde el inicio.");
  if(bz==="comercio" && d.cap<=1) reasons.push("Con poco capital, la clave es vender por pedido o preventa y no comprar stock hasta tener demanda.");
  else reasons.push(d.cap<=1 ? "Casi no requiere inversión: tu activo principal es tu tiempo y tu habilidad." : "Tu capital permite probar con un presupuesto controlado, que liberaremos por tramos.");
  reasons.push("Se apoya en tu mejor habilidad: "+SK[sk].name.toLowerCase()+".");
  reasons.push(d.sales<=1 ? "Permite empezar con conversaciones pequeñas y cercanas, la mejor forma de ganar soltura vendiendo." : "Tu comodidad para vender acelera la validación: puedes hablar con más clientes en menos tiempo.");
  if(d.hours<=3) reasons.push("Con pocas horas necesitas una sola oferta y un solo canal, y este modelo lo permite.");
  var biz={
    name:bd.name, short:bd.short, offer:offer, ideas:ideas,
    niche:"Nicho sugerido por tu interés en "+intName+": "+niche+".",
    reasons:reasons,
    planB:BIZ[bz2].name+". Evalúalo después del día 90, cuando tengas datos reales de lo que te piden tus clientes.",
    key:bz
  };

  /* 4. Por dónde empezar */
  var script="Hola [nombre], estoy empezando un proyecto de [tu servicio] para "+niche+". ¿Me regalas 10 minutos para contarme cómo resuelves hoy [el problema]? No te voy a vender nada, solo quiero entender cómo lo viven.";
  var firstCharge = d.urg===3 ? "Tu primer cobro tiene fecha: antes del día 30." : (d.urg===2 ? "Tu primer cobro tiene fecha: antes del día 60." : "Tu primera venta real tiene fecha: antes del día 75.");
  var budget=[
    "Presupuesto máximo del trimestre: USD 30. Usa solo herramientas gratuitas.",
    "Presupuesto máximo del trimestre: USD 150, y solo después de tu primera venta.",
    "Presupuesto máximo del trimestre: USD 500, repartido en tramos que liberas tras cada venta validada.",
    "Presupuesto máximo del trimestre: USD 1.000, y no más del 25% antes de tu tercera venta."
  ][d.cap];
  var start={
    steps:[
      { time:"20 min", t:"Escribe tu oferta en una frase", d:"Ayudo a "+niche+" a lograr [resultado medible] en [plazo], por un precio fijo de [monto]. Si no puedes completar los corchetes, ya sabes qué preguntarle a tus primeros clientes." },
      { time:"40 min", t:"Arma tu lista de 20 contactos", d:"Busca "+CONTACTS[bz]+". Anota nombre, cómo llegar a esa persona y qué problema crees que tiene." },
      { time:"30 min", t:"Envía los primeros 5 mensajes hoy", d:d.sales<=1 ? "Usa este guion tal cual. Copiarlo no es trampa, es práctica:" : "Usa este guion como base y adáptalo a tu estilo:", script:script }
    ],
    rule:firstCharge+" "+budget,
    measure:["Conversaciones con potenciales clientes","Propuestas o presupuestos enviados","Ventas cerradas y dinero cobrado"],
    closing:"Tienes "+hLab+", "+capLab+" y una habilidad concreta. Con eso alcanza para una primera venta. Lo que decide el resultado es la primera conversación, y puedes tenerla esta semana."
      +(d.exp===1?" Ya lo intentaste una vez, así que esta vez empiezas sabiendo qué evitar.":"")
      +(d.block==="fear"?" El miedo baja con la acción: mide tu avance por conversaciones, no por resultados.":"")
  };

  /* 5. Plan de 90 días */
  var nConv=[8,10,12,15][d.sales];
  var split = d.hoursEff<=3 ? "Con tan pocas horas, tu ventaja es el foco: una oferta, un canal y un tipo de cliente. Reparte 1 h para hablar con clientes, 1,5 h para producir y 0,5 h para revisar números."
    : d.hoursEff<=8 ? "Reparte: 3 h para hablar con clientes, 4 h para producir o entregar y 1 h para revisar números y aprender."
    : d.hoursEff<=15 ? "Reparte: 6 h para clientes, 7 h para producir o entregar y 2 h para números y aprendizaje."
    : "Reparte: 10 h para clientes, 15 h para producir o entregar, 3 h para números y 2 h para aprendizaje.";
  var timeItem="Tu tiempo: "+HLAB[d.hoursEff]+". "+split+(d.fuTime==="free"?" Antes de empezar, libera al menos 5 horas fijas por semana: es la condición para que este plan funcione.":"");
  var salesTip = {
    reject:"Tu meta de la primera semana es conseguir 5 respuestas negativas. Cuando el «no» es un objetivo, deja de dar miedo.",
    price:"Habla de precio con paquetes cerrados: «Incluye X, Y y Z por $N». Ensaya la frase en voz alta 10 veces antes de usarla.",
    script:"Usa el guion de la sección «Por dónde empezar» en tus primeras 10 conversaciones y ajústalo con lo que aprendas.",
    worth:"Pide a 3 personas que te conocen qué problema suyo les has resuelto. Suele revelar tu oferta real. Después ofrece una primera tarea de bajo riesgo."
  }[d.fuSales] || (d.sales===1 ? "Los nervios son normales. Con 10 conversaciones bajan mucho. Empieza por tu círculo cercano." : "Aprovecha tu comodidad para hablar: 2 llamadas o notas de voz por día con personas de tu lista.");
  var urgItem = d.urg===3 ? "Prioridad del mes: el primer cobro antes del día 45. Cobra aunque sea poco y ajusta el precio después."
    : d.urg===2 ? "Prioridad del mes: primera venta antes del día 60 y repetirla con un segundo cliente."
    : "Prioridad del mes: una venta real antes del día 75, aunque tu modelo sea de largo plazo. Valida con dinero, no con opiniones.";
  var goalItem = {
    extra:"Ordena tu semana para sostener el ingreso extra con el mínimo tiempo: un horario fijo de entrega y otro de ventas.",
    replace:"Define tu número: cuánto necesitas facturar al mes para reemplazar tu ingreso y a cuántos clientes o ventas equivale.",
    scale:"Documenta cada proceso que repites. Lo que no se documenta no se puede delegar ni escalar.",
    free:"Identifica las 3 tareas que más tiempo te consumen y decide si se automatizan, se delegan o se eliminan."
  }[d.goalEff];
  var sitTip = {
    ft:"No dejes tu empleo hasta que el negocio cubra al menos el 50% de tu sueldo durante 3 meses seguidos.",
    pt:"Usa tus horas libres más fijas para clientes y deja las irregulares para tareas que se pueden mover.",
    st:"Bloquea 2 franjas fijas por semana compatibles con tu estudio y no las muevas.",
    un:"Destina las primeras ganancias a cubrir gastos esenciales antes de reinvertir.",
    ot:"Define 2 franjas fijas por semana para este proyecto y trátalas como compromisos con otra persona."
  }[d.sit];
  var clients2=[1,2,2,3][d.urg];
  var inc2={extra:"USD 100 a 200", replace:"USD 150 a 300", scale:"USD 100 a 300", free:"USD 100 a 250"}[d.goalEff];
  var g3={
    extra:"Meta del mes: USD 200 a 400 de ingreso y un sistema que te lleve menos de "+HLAB[d.hoursEff].replace(" por semana","")+" por semana.",
    replace:"Meta del mes: cubrir entre el 25% y el 30% de tu ingreso actual con el negocio, y tener un plan a 12 meses para llegar al 100%.",
    scale:"Meta del mes: 5 clientes o ventas recurrentes, un proceso documentado y un canal que traiga clientes sin que tengas que pedir cada vez.",
    free:"Meta del mes: que la mitad de tus tareas repetitivas estén documentadas o automatizadas, y 2 clientes recurrentes."
  }[d.goalEff]+(d.fuTime==="stages"?" Con tu ritmo actual, este es el primer tramo de un camino de 12 a 18 meses.":"");
  var plan=[
    { t:"Definir y validar", rng:"Días 1 a 30", items:[bd.m1[0],bd.m1[1],salesTip,timeItem],
      goal:"Meta del mes: "+nConv+" conversaciones con potenciales clientes y una oferta escrita con precio." },
    { t:"Vender", rng:"Días 31 a 60", items:[bd.m2[0],bd.m2[1],urgItem,budget],
      goal:"Meta del mes: "+clients2+(clients2===1?" cliente o venta paga":" clientes o ventas pagas")+". Ingreso de referencia: "+inc2+"." },
    { t:"Ordenar y crecer", rng:"Días 61 a 90", items:[bd.m3[0],bd.m3[1],goalItem,sitTip], goal:g3 }
  ];

  /* 6. Errores */
  var P=[];
  function add(p,t,fix){ P.push({p:p,t:t,fix:fix}); }
  if(d.block==="fear") add(10,"Esperar a sentirte listo para empezar","La confianza se construye después de las primeras ventas. Fija una fecha para tu primera conversación con un cliente y cúmplela aunque sientas que falta algo.");
  if(d.block==="idea") add(10,"Buscar la idea perfecta","Parte de tu habilidad en "+SK[sk].name.toLowerCase()+" y de personas que ya conoces. Elige la oferta más simple y mejórala con clientes reales. Con 3 conversaciones sabrás más que con 3 semanas de ideas.");
  if(d.block==="money") add(10,"Gastar antes de vender","Nada de logo, web, stock ni cursos pagos hasta tu primera venta. Con "+capLab+" disponibles, la restricción es una ventaja: te obliga a validar primero.");
  if(d.block==="time") add(10,"Querer hacer todo con pocas horas","Una oferta, un canal y un tipo de cliente. Todo lo demás espera al día 90.");
  if(d.block==="knowledge") add(10,"Acumular cursos en lugar de vender","Por cada hora de formación, dedica dos a hablar con clientes o a entregar algo. Aprendes lo que necesites cuando un cliente lo pide.");
  if(d.sales<=1) add(9,"Esconderte detrás del trabajo en vez de hablar con clientes","Preparar, diseñar y «mejorar» es más cómodo que ofrecer. Fija una cuota semanal de conversaciones y revísala cada domingo.");
  if(d.urg===3 && (bz==="audiencia"||bz==="producto")) add(9,"Elegir un modelo lento cuando necesitas caja rápida","Si necesitas ingresos pronto, vende primero un servicio simple y deja la audiencia o el producto para después.");
  if(d.fuS==="product" && d.cap===0) add(9,"Comprar mercadería antes de validar la demanda","Con tan poco capital, vende por pedido o preventa. Compra al proveedor solo cuando el cliente ya pagó.");
  if(d.fuS==="unsure") add(8,"Dudar entre servicio y producto","Decide por 30 días: vende un servicio y observa qué te piden. Esa información te dice qué producto crear después.");
  if(d.appr==="launch") add(8,"Lanzarte sin validar","Tu impulso es valioso, dirígelo. Antes de producir, consigue una promesa de compra o una preventa.");
  if(d.appr==="plan") add(8,"Sobreplanificar","Una página de plan es suficiente. Si llevas más de 7 días sin hablar con un cliente, el plan se volvió una excusa.");
  if(d.exp===1) add(8,"Repetir el patrón de tu intento anterior","Revisa con honestidad por qué no funcionó: no lograste vender, no había demanda o no sostuviste el esfuerzo. Cambia esa variable concreta esta vez.");
  if(d.sit==="ft" && (d.goalEff==="replace"||d.goalEff==="scale")) add(7,"Renunciar demasiado pronto","No dejes tu ingreso estable hasta que el negocio cubra al menos el 50% de tu sueldo durante 3 meses seguidos.");
  if(d.cap>=2) add(6,"Usar el capital como sustituto de la validación","Tener dinero tienta a contratar y comprar antes de tiempo. Reparte la inversión en tramos y libera cada uno cuando haya una venta validada.");
  add(5,"Cobrar barato por inseguridad","Un precio bajo atrae clientes difíciles y no te deja crecer. Cobra lo que te permita entregar bien y súbelo con cada cliente nuevo.");
  add(4,"No medir","Cada semana revisa 3 números: conversaciones, propuestas y ventas. Si no sabes dónde se cae el proceso, no sabes qué arreglar.");
  P.sort(function(x,y){ return y.p-x.p; });
  var mistakes=P.slice(0,5).map(function(m){ return {t:m.t, fix:m.fix}; });

  /* 7. Recursos */
  var b1="momtest";
  var b2 = d.sales<=1 ? "influence" : (d.cap<=1 ? "hundred" : "lean");
  var b3 = (d.hoursEff<=8 || d.block==="time" || d.block==="fear") ? "atomic" : "rework";
  var res={
    libros:[b1,b2,b3].map(function(k){ return RES[k]; }),
    herr:bd.tools.map(function(k){ return RES[k]; }),
    form:[RES.startup],
    note:"Antes de cobrar de forma continua, infórmate sobre el régimen de pequeños contribuyentes de tu país. Suele ser un trámite simple y te evita problemas cuando empieces a crecer."
  };

  return { profile:profile, skill:skill, biz:biz, start:start, plan:plan, mistakes:mistakes, res:res };
}

  var L=[], p=R.profile, s=R.skill, b=R.biz, st=R.start;
  L.push("BRÚJULA EMPRENDEDORA · MI INFORME","");
  L.push("1. MI PERFIL EMPRENDEDOR", p.name+" ("+p.tag+")", p.summary, "Fortalezas: "+p.strengths.join("; "), "Punto ciego: "+p.blind, "");
  L.push("2. LA HABILIDAD QUE MÁS ME ADAPTA", s.name, s.why);
  if(s.note) L.push(s.note);
  L.push("Cómo monetizarla: "+s.money.join("; "), "Reforzar: "+s.reinforce, "");
  L.push("3. NEGOCIO IDEAL", b.name, b.short, "Primera oferta: "+b.offer, b.niche, "Por qué: "+b.reasons.join(" "), "Ideas: "+b.ideas.join("; "), "Plan B: "+b.planB, "");
  L.push("4. POR DÓNDE EMPEZAR");
  st.steps.forEach(function(x,i){ L.push((i+1)+") ["+x.time+"] "+x.t+": "+x.d+(x.script?" «"+x.script+"»":"")); });
  L.push("Regla de oro: "+st.rule, "Medir cada semana: "+st.measure.join("; "), "");
  L.push("5. PLAN DE 90 DÍAS");
  R.plan.forEach(function(m){ L.push(m.rng+" · "+m.t); m.items.forEach(function(x){ L.push("- "+x); }); L.push(m.goal); });
  L.push("","6. ERRORES QUE DEBO EVITAR");
  R.mistakes.forEach(function(m){ L.push("- "+m.t+": "+m.fix); });
  L.push("","7. RECURSOS");
  R.res.libros.concat(R.res.herr,R.res.form).forEach(function(r){ L.push("- "+r.name+(r.url?" ("+r.url+")":"")+": "+r.why); });
  L.push(R.res.note,"",st.closing);
  return L.join("\n");
}

/* ---------- Render y eventos ---------- */
function render(opts){
  opts=opts||{};
  var root=document.getElementById("root"), html;
  if(S.view==="intro") html=topbar("Para quienes empiezan de cero")+viewIntro();
  else if(S.view==="q") html=topbar("Test en curso")+viewQ();
  else html=topbar("Informe personalizado")+viewReport();
  root.innerHTML=html;
  if(opts.top){ try{ window.scrollTo(0,0); }catch(e){} }
  if(S.view==="q"){
    var sel=S.a[flow()[S.pos]], q=qById(flow()[S.pos]);
    if(sel!=null && q.opts[sel].ask && opts.focusAsk){ var inp=document.getElementById("askText"); if(inp) inp.focus(); }
  }
}
function goNext(){
  S.pos++;
  if(S.pos>=flow().length){ S.view="report"; }
  save(); render({top:true});
}
function pick(i){
  var fl=flow(), id=fl[S.pos], q=qById(id);
  if(S.lock||!q||i<0||i>=q.opts.length) return;
  S.a[id]=i; S.confirmReset=false; save();
  if(q.opts[i].ask){ render({focusAsk:true}); return; }
  S.lock=true; render();
  setTimeout(function(){ S.lock=false; goNext(); }, 240);
}
function doCopy(){
  var R=buildReport(), txt=toText(R), btn=document.getElementById("copyBtn");
  function ok(){ if(btn){ btn.textContent="Copiado"; setTimeout(function(){ if(btn) btn.textContent="Copiar mi informe"; },1800); } }
  function fail(){ S.copyFallback=true; render(); var t=document.getElementById("copybox"); if(t){ t.focus(); t.select(); } }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok,fail); }
    else fail();
  }catch(e){ fail(); }
}
function resetAll(){
  if(!S.confirmReset){ S.confirmReset=true; render(); return; }
  S.a={}; S.tx={}; S.pos=0; S.view="intro"; S.confirmReset=false; S.copyFallback=false; save(); render({top:true});
}
function onClick(e){
  var el=e.target.closest?e.target.closest("[data-act]"):null; if(!el) return;
  var act=el.getAttribute("data-act");
  if(act==="start"){ S.view="q"; S.pos=Math.min(firstOpen(),flow().length-1); S.confirmReset=false; render({top:true}); }
  else if(act==="opt"){ pick(parseInt(el.getAttribute("data-i"),10)); }
  else if(act==="cont"){ if(!el.disabled) goNext(); }
  else if(act==="back"){ if(S.pos<=0){ S.view="intro"; } else { S.pos--; } render({top:true}); }
  else if(act==="report"){ S.view="report"; render({top:true}); }
  else if(act==="review"){ S.view="q"; S.pos=0; render({top:true}); }
  else if(act==="reset"){ resetAll(); }
  else if(act==="copy"){ doCopy(); }
  else if(act==="jump"){
    var t=document.getElementById(el.getAttribute("data-to"));
    if(t){ var reduce=false; try{ reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(x){} t.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"}); }
  }
}
function onInput(e){
  if(e.target && e.target.id==="askText"){
    var id=flow()[S.pos]; S.tx[id]=e.target.value; save();
    var go=document.getElementById("askGo"); if(go) go.disabled=!(e.target.value.trim().length>=2);
  }
}
function onKey(e){
  if(S.view!=="q") return;
  if(e.target && e.target.id==="askText"){
    if(e.key==="Enter"){ var go=document.getElementById("askGo"); if(go && !go.disabled){ e.preventDefault(); goNext(); } }
    return;
  }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  var idx=LET.indexOf((e.key||"").toUpperCase());
  if(e.key && e.key.length===1 && idx>=0) pick(idx);
}
function init(){
  load();
  document.addEventListener("click",onClick);
  document.addEventListener("input",onInput);
  document.addEventListener("keydown",onKey);
  render();
}
if(typeof document!=="undefined" && document.getElementById && !(typeof window!=="undefined" && window.__BRUJULA_TEST__)) init();
</script>
